name: Build and Release XMMI-Pro

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Modern Installer and Portable Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Set up Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build & Package XMMI-Pro
        shell: pwsh
        run: |
          $Tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.version }}" }
          if (-not $Tag) { $Tag = "v1.0.0" }
          echo "RELEASE_TAG=$Tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python build_release.py --tag $Tag

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: XMMI-Pro ${{ env.RELEASE_TAG }}
          files: |
            *.exe
            *.zip
          draft: false
          prerelease: false
          generate_release_notes: true
